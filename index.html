<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Apostas</title></head><body style="font-family:system-ui;background:#07101d;color:#eef3fb;padding:32px"><p>A carregar dashboard…</p><script>(async()=>{try{let html='';for(let i=1;i<=5;i++){const r=await fetch(`lite/part${i}.html?v=74`,{cache:'no-store'});if(!r.ok)throw new Error(`part${i}: ${r.status}`);html+=await r.text();}document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<h2>Erro ao carregar o dashboard</h2><pre>'+String(e)+'</pre>';}})();</script></body></html>
