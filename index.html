<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Apostas</title></head>
<body style="font-family:system-ui;background:#07101d;color:#eef3fb;padding:32px">
<p>A carregar dashboard…</p>
<script>
(async()=>{
  try{
    let b64='';
    for(let i=1;i<=8;i++){
      const r=await fetch(`parts/part${i}.txt`,{cache:'no-store'});
      if(!r.ok) throw new Error(`part${i}: ${r.status}`);
      b64+=(await r.text()).trim();
    }
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<h2>Erro ao carregar o dashboard</h2><pre>'+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>
